services:

   # ----------------------------------------
   #  REDIS - FRAUD DETECTION + RATE LIMIT
   # ----------------------------------------
   redis:
      image: redis:latest
      container_name: fraud_redis
      ports:
         - "6379:6379"
      networks:
         - banking-network

   #  ---------------------------------------
   #  MYSQL - ALL SERVICES DATABASE
   # ----------------------------------------
   mysql:
      image: mysql:8.0
      container_name: mysql
      environment:
         MYSQL_ROOT_PASSWORD: root
      ports:
         - "3306:3306"
      volumes:
         - mysql-data:/var/lib/mysql
      networks:
         - banking-network

   # ----------------------------------------
   # ZOOKEPER - REQUIRED FOR KAFKA
   # ----------------------------------------
   zookeeper:
      image: confluentinc/cp-zookeeper:latest
      container_name: fraud_zookeeper
      environment:
         ZOOKEPER_CLIENT_PORT: 2181
         ZOOKEPER_TICK_TIME: 2000
      ports:
         - "2181:2181"
      networks:
         - banking-network

   # ----------------------------------------
   # KAFKA - EVENT STREAMING
   # ----------------------------------------

   kafka:
      image: confluentinc/cp-kafka:7.4.0
      container_name: kafka
      depends_on:
         - zookeeper
      ports:
         - "9092:9092"
      environment:
         KAFKA_BROKER_ID: 1
         KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
         KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
         KAFKA_ADVERTISED_LISTENERS: PLAINTEXT:/kafka:9092,PLAINTEXT_HOST://localhost:9092
         KAFKA_INNER_BROKER_LISTENER_NAME: PLAINTEXT
         KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
         KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      networks:
         - banking-network
volumes:
   mysql-data:

networks:
   banking-network:
      driver: bridge
